<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact and student feedback form for the WST team.">
    <title>Contact Us - WST Team Web Portfolio</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <h1>Web Systems & Technology Team Project</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>

<section>

    <h2>Contact & Student Feedback</h2>

    <form action="#" method="post">

        <!-- 1. Single-line Text Input -->
        <label for="full-name">Full Name:</label>
        <input
            type="text"
            id="full-name"
            name="full-name"
            placeholder="Enter your full name"
            required
        >

        <!-- 2. Email Input -->
        <label for="email">Email Address:</label>
        <input type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
        >

        <!-- 3. Password Field -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <!-- 4. Radio Buttons -->
        <fieldset>
            <legend>User Role</legend>

            <label>
                <input type="radio" name="role" value="student" required>
                Student
            </label>

            <label>
                <input type="radio" name="role" value="teacher">
                Teacher
            </label>

            <label>
                <input type="radio" name="role" value="visitor">
                Visitor
            </label>
        </fieldset>

        <!-- 5. Checkboxes -->
        <fieldset>
            <legend>Interests</legend>

            <label>
                <input type="checkbox" name="interest" value="html">
                HTML5
            </label>

            <label>
                <input type="checkbox" name="interest" value="css">
                CSS
            </label>

            <label>
                <input type="checkbox" name="interest" value="github">
                GitHub
            </label>

            <label>
                <input type="checkbox" name="interest" value="programming">
                Programming
            </label>
        </fieldset>

        <!-- 6. Multi-line Text Box -->
        <label for="message">Message:</label>
        <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message or feedback here..."
            required
        ></textarea>

        <!-- 7. Dropdown Selector -->
        <label for="subject">Subject Category:</label>

        <select id="subject" name="subject" required>
            <option value="">-- Select a category --</option>
            <option value="feedback">Website Feedback</option>
            <option value="html">HTML5</option>
            <option value="css">CSS</option>
            <option value="github">GitHub</option>
            <option value="other">Other</option>
        </select>

        <!-- 8. Submit and Reset Buttons -->
        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 WST Team Web Portfolio.</p>
</footer>

</body>
</html>
